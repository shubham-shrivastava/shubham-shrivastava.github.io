       text so it never depends on a font being available. -->
  <rect width="512" height="512" rx="108" fill="#0a0e14"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#1e2731" stroke-width="16"/>
  <path d="M152 168 L246 256 L152 344"
        fill="none" stroke="#5eead4" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="286" y="300" width="102" height="44" rx="12" fill="#5eead4"/>
</svg>
